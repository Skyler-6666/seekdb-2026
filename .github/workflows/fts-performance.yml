name: FTS correctness and performance

on:
  workflow_dispatch:
  push:
    branches:
      - competition/fts-fulltext-opt
      - competition/fts-perf-v2
      - competition/fts-diag

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  verify:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential \
            binutils m4 libtool-bin libncurses-dev python3 python3-pip unzip ccache gdb
          python3 -m pip install --user pymysql

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fts-${{ github.run_number }}
          restore-keys: |
            ccache-fts-
            ccache-seekdb-

      - name: Compile seekdb
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SEEKDB_TASK_DIR: ${{ github.workspace }}/seekdb_build
          MAKE_ARGS: -j4
        run: |
          set -o pipefail
          .github/script/seekdb/compile.sh 2>&1 | tee compile_seekdb.log

      - name: Verify build artifacts
        run: |
          test -x build_release/src/observer/seekdb
          test -x deps/3rd/u01/obclient/bin/obclient
          test -x deps/3rd/u01/obclient/bin/mysqltest

      - name: Run FTS correctness suite
        run: python3 -B .github/script/seekdb/run_fts_cases.py

      - name: Publish FTS correctness failures to job summary
        if: failure()
        run: |
          echo '## FTS correctness failures' >> "$GITHUB_STEP_SUMMARY"
          FAILDIR="$GITHUB_WORKSPACE/.seekdb_fts_test/work/failures"
          if [ -d "$FAILDIR" ] && [ -n "$(ls -A "$FAILDIR" 2>/dev/null)" ]; then
            find "$FAILDIR" -type f | while IFS= read -r f; do
              echo "<details><summary>$(basename "$f")</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo '' >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 100 "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo '</details>' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo 'no failure artifacts found' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start benchmark instance
        if: always()
        run: |
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          BENCH_DIR="$GITHUB_WORKSPACE/.seekdb_fts_bench"
          echo "SEEKDB_FTS_BENCH_DIR=$BENCH_DIR" >> "$GITHUB_ENV"
          python3 .github/script/seekdb/sdb.py start \
            --binary "$PWD/build_release/src/observer/seekdb" \
            --base-dir "$BENCH_DIR" --port 2881 \
            --parameter memory_budget=2G --parameter cpu_count=2 \
            --parameter datafile_size=128M --parameter datafile_maxsize=1G \
            --parameter log_disk_size=2G
          python3 .github/script/seekdb/sdb.py wait-ready \
            --client "$CLIENT_ROOT/bin/obclient" --base-dir "$BENCH_DIR" \
            --host 127.0.0.1 --port 2881 --user root --timeout 600

      - name: Run official FTS large benchmark
        if: always()
        run: |
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          export MYSQL="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -N -s --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot --default-character-set=utf8mb4"
          OUTPUT="$GITHUB_WORKSPACE/fts_large_bench_report.txt" LABEL=optimized \
            bash tools/benchmark/fts_large_bench.sh
          python3 tools/benchmark/fts_large_bench_score.py \
            "$GITHUB_WORKSPACE/fts_large_bench_report.txt" \
            | tee "$GITHUB_WORKSPACE/fts_large_bench_score.txt"

      - name: Run FTS tokenize micro-benchmark (diagnostic)
        if: always()
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/fts_large_bench_report.txt" ]; then
            echo "official benchmark did not finish; skip diagnostics"
            exit 0
          fi
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          export MYSQL="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -N -s --default-character-set=utf8mb4"
          OUTPUT="$GITHUB_WORKSPACE/fts_diag_report.txt" \
            bash tools/benchmark/fts_diag_bench.sh

      - name: Run FTS query/build diagnostics
        if: always()
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/fts_large_bench_report.txt" ]; then
            echo "official benchmark did not finish; skip query diagnostics"
            exit 0
          fi
          CLIENT_ROOT="$PWD/deps/3rd/u01/obclient"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64:${LD_LIBRARY_PATH:-}"
          export MYSQL="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot -N -s --default-character-set=utf8mb4"
          export MYSQL_VERBOSE="$CLIENT_ROOT/bin/obclient -h127.0.0.1 -P2881 -uroot --default-character-set=utf8mb4"
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true
          OUTPUT="$GITHUB_WORKSPACE/fts_diag_report.txt" \
            bash tools/benchmark/fts_query_diag.sh

      - name: Publish benchmark results to job summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/fts_large_bench_score.txt" ]; then
            { echo '## Benchmark score'; cat "$GITHUB_WORKSPACE/fts_large_bench_score.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$GITHUB_WORKSPACE/fts_large_bench_report.txt" ]; then
            { echo '## Benchmark report'; cat "$GITHUB_WORKSPACE/fts_large_bench_report.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$GITHUB_WORKSPACE/fts_diag_report.txt" ]; then
            { echo '## Tokenize micro-benchmark (diagnostic)'; cat "$GITHUB_WORKSPACE/fts_diag_report.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop benchmark instance
        if: always()
        run: |
          if [[ -n "${SEEKDB_FTS_BENCH_DIR:-}" ]]; then
            python3 .github/script/seekdb/sdb.py stop \
              --base-dir "$SEEKDB_FTS_BENCH_DIR" || true
          fi

      - name: Upload benchmark and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fts-benchmark-results
          path: |
            fts_large_bench_report.txt
            fts_large_bench_score.txt
            fts_diag_report.txt
            .seekdb_fts_test/work/failures/
            .seekdb_fts_test/instance/log/
            .seekdb_fts_bench/log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish diagnostics to results branch
        if: always()
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          git config user.name "seekdb-ci"
          git config user.email "seekdb-ci@users.noreply.github.com"
          RESBRANCH="fts-ci-results-diag"
          git checkout --orphan "$RESBRANCH" >/dev/null 2>&1
          rm -rf fts-ci-results
          mkdir -p fts-ci-results
          {
            echo "run_id: $GITHUB_RUN_ID"
            echo "run_number: $GITHUB_RUN_NUMBER"
            echo "sha: $GITHUB_SHA"
          } > fts-ci-results/run-meta.txt
          if [ -d .seekdb_fts_test/work/failures ] && [ -n "$(ls -A .seekdb_fts_test/work/failures 2>/dev/null)" ]; then
            cp -r .seekdb_fts_test/work/failures fts-ci-results/failures
          fi
          if [ -d .seekdb_fts_test/instance/log ] && [ -n "$(ls -A .seekdb_fts_test/instance/log 2>/dev/null)" ]; then
            mkdir -p fts-ci-results/instance-log
            find .seekdb_fts_test/instance/log -type f -size -20M -exec cp {} fts-ci-results/instance-log/ \;
          fi
          if [ -d .seekdb_fts_test/instance ]; then
            mkdir -p fts-ci-results/instance-log
            find .seekdb_fts_test/instance -maxdepth 1 -type f \( -name 'seekdb.log*' -o -name '*.log' \) -size -20M -exec cp {} fts-ci-results/instance-log/ \;
          fi
          for f in fts_large_bench_score.txt fts_large_bench_report.txt fts_diag_report.txt; do
            if [ -f "$f" ]; then cp "$f" fts-ci-results/; fi
          done
          if [ -f compile_seekdb.log ]; then
            tail -c 3000000 compile_seekdb.log > fts-ci-results/compile_seekdb.log.tail
          fi
          git add -f fts-ci-results >/dev/null 2>&1
          if git commit -m "ci: diagnostics for run $GITHUB_RUN_NUMBER sha $GITHUB_SHA" >/dev/null 2>&1; then
            git push --force origin "HEAD:$RESBRANCH" >/dev/null 2>&1 && echo "published diagnostics to branch $RESBRANCH"
          else
            echo "no diagnostics to publish"
          fi
