name: AI Column build check

on:
  workflow_dispatch:
  push:
    branches:
      - competition/**

jobs:
  observer:
    timeout-minutes: 240
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git wget rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses-dev python3 unzip
          sudo apt-get clean

      - name: Install Bazel 8.2.1
        run: |
          sudo curl -sSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazel/releases/download/8.2.1/bazel-8.2.1-linux-x86_64
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Prepare project dependencies
        run: bash build.sh release --init

      - name: Build share runtime
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        run: bazel build //src/share:share_runtime

      - name: Build sql runtime
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        run: bazel build //src/sql:sql_runtime

      - name: Build observer runtime
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        run: bazel build //src/observer:observer_runtime

      - name: Build seekdb binary
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
        run: bazel build //src/observer:seekdb_link
